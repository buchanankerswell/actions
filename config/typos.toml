# Running list: when typos CI fails on a new word, add it here
# (allowlist-by-default) or keep it repo-local with a comment saying why.
# Per-repo .typos.toml files hold only [files] extend-exclude sections
# (generated/vendored paths are repo-specific) plus any words that
# genuinely belong to one repo.

