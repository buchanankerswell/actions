---
name: Reusable Python test and release
on:
  workflow_call:
    inputs:
      package:
        description: "Importable package name (used for the coverage flag)"
        required: true
        type: string
      python-version:
        description: "Python version for the test matrix and the release build"
        required: false
        default: "3.13"
        type: string
    secrets:
      codecov-token:
        required: true
      test-pypi-api-token:
        required: true
      pypi-api-token:
        required: true
jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ inputs.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ inputs.python-version }}"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests and generate coverage report
        run: |
          pytest --cov=${{ inputs.package }} --cov-branch --cov-report=xml
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c8475a5 # v7.1.1, node24 (v5 tag still nests github-script v7/node20)
        with:
          token: ${{ secrets.codecov-token }}
  check-version:
    name: Check if final release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.check_tag.outputs.is_release }}
    steps:
      - name: Check tag format
        id: check_tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          if [[ "$VERSION" == *"-"* ]]; then
            echo "Tag $TAG is a prerelease version"
            echo "is_release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG is a full release"
            echo "is_release=true" >> $GITHUB_OUTPUT
          fi
  build:
    name: Build and Upload to PyPI
    needs: check-version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ inputs.python-version }}"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine build setuptools-scm
      - name: Verify version
        run: python -m setuptools_scm
      - name: Build distribution
        run: |
          rm -rf dist build *.egg-info
          python -m build
      - name: Check dist artifacts
        run: |
          ls -lh dist
          test -f dist/*.whl
          test -f dist/*.tar.gz
      - name: Upload to Test PyPI
        run: twine upload --verbose --repository-url https://test.pypi.org/legacy/ dist/*
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.test-pypi-api-token }}
      - name: Upload to PyPI
        run: twine upload --verbose dist/*
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.pypi-api-token }}
      - name: Upload dist to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ needs.check-version.outputs.is_release != 'true' }}
