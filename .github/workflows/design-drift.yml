---
name: Reusable design drift check
on:
  workflow_call:
    inputs:
      static-dir:
        description: "Directory holding the vendored design files"
        required: true
        type: string
      files:
        description: "Space-separated design files to diff"
        required: false
        default: "tokens.css dialogs.css dialogs.js"
        type: string
      canonical-ref:
        description: "actions ref to diff against (tracks the caller's pin)"
        required: false
        default: "v1"
        type: string
jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: buchanankerswell/actions
          ref: ${{ inputs.canonical-ref }}
          path: canonical
      - name: Diff vendored files against canonical design/
        run: |
          for f in ${{ inputs.files }}; do
            diff -u "canonical/design/$f" "${{ inputs.static-dir }}/$f"
          done
