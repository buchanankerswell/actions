---
name: Reusable Python docs build
on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version for the docs build"
        required: false
        default: "3.13"
        type: string
      retention-days:
        description: "How long to keep the built HTML artifact (rebuildable from any tag)"
        required: false
        default: 14
        type: number
jobs:
  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ inputs.python-version }}"
          cache: "pip"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r docs/requirements.txt
      - name: Build documentation
        run: |
          cd docs
          make html
      - name: Upload docs as artifact
        uses: actions/upload-artifact@v6
        with:
          name: html-docs-ubuntu-24.04-python-${{ inputs.python-version }}
          path: docs/_build/html
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
